<section aria-labelledby="language-heading">
  <h2 id="language-heading"><app-resume-icon class="section-icon" [name]="language().style || 'fa-language'" />{{ language().label }}</h2>
  <ul class="inline-list">
    @for (item of language().languages; track $index) {
      <li>
        <strong>{{ item.name }}</strong> - {{ item.level }}
      </li>
    }
  </ul>
</section>
