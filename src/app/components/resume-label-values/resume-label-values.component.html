<section [attr.aria-label]="labelValues().label">
  <h2><app-resume-icon class="section-icon" [name]="labelValues().style || 'fa-list'" />{{ labelValues().label }}</h2>
  <ul class="inline-list">
    @for (value of labelValues().values; track $index) {
      <li>{{ value }}</li>
    }
  </ul>
</section>
