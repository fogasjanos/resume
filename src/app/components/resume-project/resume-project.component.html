<section aria-labelledby="project-heading">
  <h2 id="project-heading"><app-resume-icon class="section-icon" [name]="project().style || 'fa-rocket'" />{{ project().label }}</h2>
  <ul>
    @for (item of project().projects; track $index) {
      <li>
        <strong>{{ item.name }}</strong> - {{ item.description }}
      </li>
    }
  </ul>
</section>
